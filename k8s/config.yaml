---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bioportal-config
  namespace: bioportal
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "bioportal.blablador.fz-juelich.de"
  DJANGO_CSRF_ORIGINS: "https://bioportal.blablador.fz-juelich.de"
  SITE_BASE_URL: "https://bioportal.blablador.fz-juelich.de"

  DB_HOST: "bioportal-db"
  DB_NAME: "bioportal"
  DB_USER: "bioportal"

  # Result archives live on the Longhorn volume, not in the container.
  ARTIFACT_ROOT: "/data/artifacts"
  BLABLADOR_API_BASE: "https://api.blablador.fz-juelich.de/v1"

  # Per-user fairness. The whole molecular service accepts ~100 queued jobs
  # across all users, so raise this deliberately.
  MAX_ACTIVE_JOBS_PER_USER: "5"
  STALE_RUNNING_SECONDS: "108000"

  # Shown on /privacy/ and /terms/. The pages flag themselves as incomplete
  # until the controller, DPO and admin contact are all set.
  PRIVACY_CONTROLLER: "Forschungszentrum Jülich GmbH"
  PRIVACY_ADMIN_CONTACT: "a.strube@fz-juelich.de"
  SECURITY_CONTACT: "cert@fz-juelich.de"
  # Role address published in Forschungszentrum Jülich's own data protection
  # notices. Confirm it is current before the statement is approved.
  PRIVACY_DPO_CONTACT: "DSB@fz-juelich.de"
  # Set to "1" only once the DPO has reviewed the statement text.
  PRIVACY_APPROVED: "0"
  # Set to "1" once the rules of use at /terms/ have been adopted.
  TERMS_APPROVED: "0"

  OIDC_ISSUER: "https://login.helmholtz.de/oauth2"
  # Empty accepts any successful Helmholtz AAI login. Set before announcing.
  OIDC_ALLOWED_ENTITLEMENTS: ""
  # No AAI client is registered yet, so federated sign-in cannot work and this
  # portal would otherwise be a catalogue nobody can submit through. Turned off
  # by itself the moment OIDC_CLIENT_ID and OIDC_CLIENT_SECRET are set.
  ALLOW_SELF_SIGNUP: "1"

  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "mail.fz-juelich.de"
  EMAIL_PORT: "25"
  DEFAULT_FROM_EMAIL: "bioportal@fz-juelich.de"
  LOG_LEVEL: "INFO"
