{% extends "base.html" %}
{% block title %}Sign in · BioPortal{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p><a class="button" href="{% url 'oidc_authentication_init' %}">Sign in with JSC / Helmholtz AAI</a></p>
<details class="localauth">
  <summary>Administrator sign-in</summary>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</details>
{% endblock %}
