<div id="viewer" class="viewer" data-url="{% url 'jobs:preview' job.pk %}"></div>
<p class="hint">
  Largest structure in the archive, rendered in your browser. Rotate by
  dragging; scroll to zoom.
</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ngl/2.3.1/ngl.js"></script>
<script>
(function () {
  var el = document.getElementById("viewer");
  if (!el || !window.NGL) return;
  var stage = new NGL.Stage(el, {backgroundColor: "white"});
  window.addEventListener("resize", function () { stage.handleResize(); });

  fetch(el.dataset.url, {credentials: "same-origin"})
    .then(function (r) {
      if (!r.ok) throw new Error("no preview available");
      return r.text();
    })
    .then(function (text) {
      var blob = new Blob([text], {type: "text/plain"});
      return stage.loadFile(blob, {ext: "pdb"});
    })
    .then(function (c) {
      // Colour complexes by chain so a binder is distinguishable from its
      // target; a single chain keeps the per-residue confidence colouring.
      var scheme = c.structure.chainStore.count > 1 ? "chainname" : "bfactor";
      var rep = c.addRepresentation("cartoon", {colorScheme: scheme});
      if (!rep.repr.bufferList.length) {
        // Predicted structures carry no HELIX/SHEET records, and the cartoon
        // representation then draws nothing at all.
        c.removeRepresentation(rep);
        c.addRepresentation("backbone", {colorScheme: scheme});
      }
      c.addRepresentation("ball+stick", {sele: "hetero and not water"});
      c.autoView();
    })
    .catch(function (err) {
      el.innerHTML = '<p class="hint">No inline preview available (' +
        String(err.message || err) + '). Download the archive to inspect it.</p>';
    });
})();
</script>
